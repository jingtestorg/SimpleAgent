apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: hello-greeting-agent
  version: "1.0.0"

agentCard:
  name: Hello Greeting Agent
  version: "1.0.0"
  description: "Greets users with a personalised message based on the current time of day and live weather conditions. Supports conversational follow-up questions about the weather."

container:
  buildPath: .
  port: 5000

provides:
  apis:
    - name: hello-greeting-agent
      kind: a2a
      ordId: customer.build:apiResource:hello-greeting-agent-30743.hello-greeting-agent:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
